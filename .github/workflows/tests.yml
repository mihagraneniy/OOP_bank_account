
name: Python CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

# Не запускаем несколько одинаковых проверок для одного коммита
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================
  # 1. CODE QUALITY
  # ==========================================
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff - Lint
        run: |
          ruff check . --output-format=github

      - name: Ruff - Format check
        run: |
          ruff format --check .

      - name: Mypy - Type checking
        run: |
          mypy --ignore-missing-imports .

  # ==========================================
  # 2. AUTOMATED TESTING
  # ==========================================
  tests:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Environment information
        run: |
          python --version
          pip --version
          pip list

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check dependencies
        run: |
          pip check

      - name: Run pytest
        run: |
          python -m pytest tests/ \
            -v \
            -ra \
            --tb=long \
            --durations=20 \
            --strict-markers \
            --cov \
            --cov-report=term-missing \
            --cov-report=html:coverage-report \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-python-${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.xml
            coverage-report/
          if-no-files-found: warn
          retention-days: 14

  # ==========================================
  # 3. FINAL CI STATUS
  # ==========================================
  ci-status:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [quality, tests]
    if: always()

    steps:
      - name: Check pipeline results
        run: |
          echo "Code Quality: ${{ needs.quality.result }}"
          echo "Tests: ${{ needs.tests.result }}"

          if [ "${{ needs.quality.result }}" != "success" ] || \
             [ "${{ needs.tests.result }}" != "success" ]; then
            echo "CI pipeline failed!"
            exit 1
          fi

          echo "All CI checks passed successfully!"
