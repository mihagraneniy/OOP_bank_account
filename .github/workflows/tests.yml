
name: Python Tests CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      # 1. Получаем исходный код
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Устанавливаем Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 3. Информация об окружении
      - name: Environment information
        run: |
          python --version
          pip --version
          python -m pip list

      # 4. Устанавливаем зависимости
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # 5. Проверяем установленные зависимости
      - name: Check dependencies
        run: pip check

      # 6. Запускаем тесты с подробным выводом
      - name: Run tests
        run: |
          python -m pytest tests/ \
            -v \
            -ra \
            --tb=long \
            --durations=20 \
            --strict-markers \
            --cov \
            --cov-report=term-missing \
            --cov-report=html:coverage-report \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml

      # 7. Сохраняем отчёты даже при падении тестов
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-python-${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.xml
            coverage-report/
          if-no-files-found: warn
          retention-days: 14
